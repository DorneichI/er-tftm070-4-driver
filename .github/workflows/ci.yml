name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10-3.12 are claimed in the pyproject classifiers — test them.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm derives the version from git history
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: pytest -q

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    env:
      # The shipped wheel must stay pure (py3-none-any): with the C
      # extension compiled it becomes platform-tagged linux_x86_64, which
      # PyPI rejects.  The extension is optional, so a broken compiler
      # skips it (same path the no-compiler job exercises); the sdist
      # keeps the C source, and `pip install ertftm070 --no-binary
      # ertftm070` builds the fast path on the target.
      CC: /bin/false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: the sdist must not ship dev-only directories
        # egg-info/PKG-INFO must stay (sdist installs reproduce the version
        # from them); a transient setup.cfg may be snapshotted by
        # setuptools_scm mid-build and cannot be excluded via MANIFEST.in.
        run: |
          tar tzf dist/ertftm070-*.tar.gz | grep -E '(^|/)(tests/|examples/|legacy/|docs/|\.github/|\.venv)' \
            && { echo "sdist contains dev-only directories:"; tar tzf dist/ertftm070-*.tar.gz | grep -E '(^|/)(tests/|examples/|legacy/|docs/|\.github/|\.venv)'; exit 1; } || true
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  no-compiler:
    name: install without a compiler (slow-backend fallback)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install with a broken compiler — the optional C extension must be skipped
        env:
          CC: /bin/false
        run: pip install .
      - name: the pure-Python backend must take over
        run: python -c "import ertftm070; assert ertftm070.BACKEND == 'slow'"

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, no-compiler]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing
      actions: read # download-artifact fetches the built dist
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

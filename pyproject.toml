[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ertftm070"
dynamic = ["version"]
description = "Python driver for the EastRising ER-TFTM070-4V2.1 7-inch TFT (SSD1963) on Raspberry Pi"
readme = "README.md"
license = "MIT"
authors = [{ name = "Immanuel Dorneich" }]
requires-python = ">=3.9"
keywords = ["ssd1963", "tft", "display", "lcd", "raspberry-pi", "8080"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
# The `Pillow` extra (spelled exactly like every doc says) is only needed
# for Display.image(); the core has zero runtime deps.  The floor is 9.1:
# Image.Transpose (used by rotate_image) landed in 9.1.0.
Pillow = ["Pillow>=9.1"]
# The `sim` extra runs the browser simulator (ERTFTM070_DISPLAY=sim); the
# package imports it lazily, so core installs stay dependency-free.
# websockets >= 14 is the first release where the new asyncio server API
# (the one simulator.py uses) is the documented default; it supports
# Python 3.9, and pip resolves newer releases per interpreter.
sim = ["websockets>=14"]
dev = ["pytest>=7", "ruff>=0.6", "Pillow>=9.1", "build", "websockets>=14"]

[project.scripts]
ertftm070 = "ertftm070.__main__:main"

[project.urls]
Homepage = "https://github.com/DorneichI/er-tftm070-4-driver"
Documentation = "https://github.com/DorneichI/er-tftm070-4-driver#readme"
Repository = "https://github.com/DorneichI/er-tftm070-4-driver"
Issues = "https://github.com/DorneichI/er-tftm070-4-driver/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The simulator's browser page ships inside the wheel (and, via
# MANIFEST.in, the sdist) so ERTFTM070_DISPLAY=sim works from any install.
[tool.setuptools.package-data]
ertftm070 = ["sim.html"]

# The optional C extension is declared in setup.py (not here): it makes
# pixel writes ~1400x faster than Python bit-banging, but pip install
# succeeds without a compiler and the pure-Python /dev/gpiomem backend
# takes over automatically.  setup.py also gates the declaration behind
# ERTFTM070_NO_FASTIO=1 so the release wheel stays pure (py3-none-any) —
# a declared extension platform-tags the wheel even when not built.

[tool.setuptools_scm]
fallback_version = "0.3.0"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
